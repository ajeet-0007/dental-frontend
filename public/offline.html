<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Dentzoo - You're Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 2rem;
        text-align: center;
      }
      .logo { width: 80px; height: 80px; margin-bottom: 1.5rem; }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
      p { color: #64748b; line-height: 1.6; max-width: 320px; }
      .retry-btn {
        margin-top: 1.5rem;
        padding: 0.75rem 2rem;
        background: #0ea5e9;
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .retry-btn:hover { background: #0284c7; }
    </style>
  </head>
  <body>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a10 10 0 1 0 10 10"/>
      <path d="M12 6v6l4 2"/>
    </svg>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again. Dentzoo will be back once you're connected.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </body>
</html>
